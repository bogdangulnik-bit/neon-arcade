<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1,user-scalable=no">
<title>NEON ARCADE</title>
<link rel="manifest"
href="manifest.json">
<meta name="theme-color"
content="#05050a">
<style>
*{box-sizing:border-box;
margin:0;padding:0;
font-family:sans-serif;
user-select:none;
-webkit-user-select:none}
body,html{width:100%;height:100%;
overflow:hidden;
background:#05050a;color:#fff;
touch-action:none}
canvas{display:block;
width:100vw;height:100vh;
touch-action:none}
#menu{position:fixed;inset:0;
background:rgba(5,5,10,.94);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:20;padding:20px;
text-align:center}
h1{font-size:2.2rem;
color:#00ffcc;
text-shadow:0 0 15px #00ffcc;
margin-bottom:8px;
letter-spacing:2px}
p{color:#8899a6;
margin-bottom:24px;
font-size:.9rem}
.btn{width:100%;max-width:280px;
padding:16px;margin:8px 0;
border:2px solid #00ffcc;
background:rgba(0,255,204,.1);
color:#fff;font-size:1.1rem;
font-weight:700;
border-radius:14px}
.btn.pink{border-color:#ff2a85;
background:rgba(255,42,133,.1)}
#hud{position:fixed;top:15px;
left:15px;right:15px;
display:none;
justify-content:space-between;
align-items:center;z-index:10;
font-size:1.1rem;
font-weight:700}
#back{background:#ff2a85;
border:none;color:#fff;
padding:8px 14px;
border-radius:10px;
font-weight:700}
#dpad{position:fixed;
bottom:25px;left:50%;
transform:translateX(-50%);
display:none;
grid-template-columns:repeat(3,68px);
grid-template-rows:repeat(2,68px);
gap:8px;z-index:15}
.pad-btn{background:
rgba(0,255,204,.2);
border:2px solid #00ffcc;
color:#00ffcc;
font-size:1.6rem;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center}
.pad-btn:active{
background:#00ffcc;color:#000}
</style>
</head>
<body>
<div id="hud">
<div>BODOVI:
<span id="sc"
style="color:#00ffcc">0</span>
</div>
<button id="back"
onclick="toMenu()">IZBORNIK
</button>
</div>
<div id="menu">
<h1>NEON ARCADE</h1>
<p>Rekord:
<span id="hi">0</span></p>
<button class="btn"
onclick="startSnake()">
NEON SNAKE</button>
<button class="btn pink"
onclick="startSpace()">
SPACE DEFENDER</button>
</div>
<div id="dpad">
<div></div>
<button class="pad-btn"
onpointerdown="setD(0,-1)">▲
</button>
<div></div>
<button class="pad-btn"
onpointerdown="setD(-1,0)">◀
</button>
<button class="pad-btn"
onpointerdown="setD(0,1)">▼
</button>
<button class="pad-btn"
onpointerdown="setD(1,0)">▶
</button>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W,H,mode='',score=0,loopId;
let hi=localStorage.getItem(
'arcade_hi')||0;
document.getElementById('hi')
.textContent=hi;
function rsz(){
W=c.width=innerWidth;
H=c.height=innerHeight;}
window.onresize=rsz;rsz();
function addScore(p){
score+=p;
document.getElementById('sc')
.textContent=score;
if(score>hi){hi=score;
localStorage.setItem(
'arcade_hi',hi);
document.getElementById('hi')
.textContent=hi;}}
function toMenu(){
mode='';
cancelAnimationFrame(loopId);
document.getElementById('hud')
.style.display='none';
document.getElementById('dpad')
.style.display='none';
document.getElementById('menu')
.style.display='flex';}
let snk,dir,ndir,food,stmr;
function setD(x,y){
if(x!==0&&dir.x===-x)return;
if(y!==0&&dir.y===-y)return;
ndir={x:x,y:y};}
function startSnake(){
mode='snake';score=0;
document.getElementById('sc')
.textContent=0;
document.getElementById('menu')
.style.display='none';
document.getElementById('hud')
.style.display='flex';
document.getElementById('dpad')
.style.display='grid';
snk=[{x:8,y:8},{x:7,y:8}];
dir={x:1,y:0};ndir={x:1,y:0};
food={x:12,y:12};stmr=0;
loop();}
let ship,bul,enm,etmr;
function startSpace(){
mode='space';score=0;
document.getElementById('sc')
.textContent=0;
document.getElementById('menu')
.style.display='none';
document.getElementById('hud')
.style.display='flex';
document.getElementById('dpad')
.style.display='none';
ship={x:W/2,y:H-110};
bul=[];enm=[];etmr=0;
loop();}
let px=0,py=0,isDown=false;
c.onpointerdown=e=>{
isDown=true;
px=e.clientX;py=e.clientY;
if(mode==='space')ship.x=px;};
c.onpointermove=e=>{
if(!isDown)return;
const x=e.clientX;
const y=e.clientY;
if(mode==='space'){ship.x=x;}
else if(mode==='snake'){
const dx=x-px,dy=y-py;
if(Math.abs(dx)>22||
Math.abs(dy)>22){
if(Math.abs(dx)>Math.abs(dy)){
setD(dx>0?1:-1,0);
}else{setD(0,dy>0?1:-1);}
px=x;py=y;}}};
window.onpointerup=()=>{
isDown=false;};
function loop(){
if(!mode)return;
ctx.fillStyle='rgba(5,5,10,.35)';
ctx.fillRect(0,0,W,H);
if(mode==='snake'){
const gs=20;
const cols=Math.floor(W/gs);
const rows=Math.floor((H-185)/gs);
if(++stmr>7){
stmr=0;dir=ndir;
const head=snk.at(0);
const hd={
x:(head.x+dir.x+cols)%cols,
y:(head.y+dir.y+rows)%rows};
if(snk.some(s=>
s.x===hd.x&&s.y===hd.y)){
alert('Kraj! Bodovi: '+score);
return toMenu();}
snk.unshift(hd);
if(hd.x===food.x&&
hd.y===food.y){
addScore(10);
food={
x:Math.floor(Math.random()*cols),
y:Math.floor(Math.random()*rows)};
}else snk.pop();}
ctx.fillStyle='#ff2a85';
ctx.fillRect(food.x*gs+2,
food.y*gs+2,gs-4,gs-4);
ctx.fillStyle='#00ffcc';
snk.forEach(s=>ctx.fillRect(
s.x*gs+1,s.y*gs+1,gs-2,gs-2));
}else if(mode==='space'){
if(++etmr%14===0)
bul.push({x:ship.x,y:ship.y-20});
if(etmr%32===0)
enm.push({
x:Math.random()*(W-40)+20,y:-20});
ctx.fillStyle='#00ffcc';
ctx.beginPath();
ctx.moveTo(ship.x,ship.y-20);
ctx.lineTo(ship.x-18,ship.y+15);
ctx.lineTo(ship.x+18,ship.y+15);
ctx.fill();
ctx.fillStyle='#fff';
bul.forEach((b,i)=>{
b.y-=12;
ctx.fillRect(b.x-2,b.y,4,12);
if(b.y<0)bul.splice(i,1);});
ctx.fillStyle='#ff2a85';
enm.forEach((e,ei)=>{
e.y+=4;
ctx.fillRect(e.x-15,e.y-15,30,30);
if(e.y>H){
alert('Kraj! Bodovi: '+score);
return toMenu();}
bul.forEach((b,bi)=>{
if(Math.abs(b.x-e.x)<22&&
Math.abs(b.y-e.y)<22){
enm.splice(ei,1);
bul.splice(bi,1);
addScore(20);}});});}
loopId=requestAnimationFrame(loop);}
</script>
</body>
</html>
